<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1360" viewBox="0 0 1440 1360" role="img" aria-labelledby="title description">
<title id="title">Oriva — the brand and interface system</title>
<desc id="description">An editorial style board showing original compass logo variations, forest and citron color tokens, Fraunces and DM Sans type hierarchy, buttons and focus treatment, a labeled input, spacing, geometry, iconography, and a sample property card with an original architectural illustration.</desc>
