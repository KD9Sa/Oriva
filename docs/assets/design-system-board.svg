<rect width="1440" height="1360" fill="#f8f8f3"/>
<rect width="1440" height="230" fill="#243f35"/>
<text x="72" y="43" class="sans" font-size="11" letter-spacing="3" fill="#d4e5ae">ORIVA / THE ART OF A GOOD GETAWAY</text>
<text x="1251" y="43" class="sans" font-size="11" letter-spacing="3" fill="#d4e5ae">VOL. 01</text>
<g color="#d4e5ae"><use href="#mark" transform="translate(70 76) scale(1.2)"/></g>
<text x="152" y="166" font-family="Fraunces,Georgia,serif" font-size="109" letter-spacing="-6" fill="#f8f8f3">oriva</text>
<text x="76" y="205" class="sans" font-size="11" letter-spacing="2" fill="#d4e5ae">HORIZONS. ARRIVAL. A LITTLE ELSEWHERE.</text>
<text x="825" y="112" font-family="Fraunces,Georgia,serif" font-size="42" fill="#f8f8f3">Considered journeys.</text>
<text x="825" y="150" class="sans" font-size="16" fill="#e2e7db">A warm, observant, quietly confident identity.</text>
<text x="825" y="181" class="sans" font-size="13" fill="#d4e5ae">Selected direction / The slow travel journal</text>

<text x="72" y="272" class="label">01 / THE PALETTE</text>
<rect x="72" y="295" width="245" height="116" rx="4" fill="#243f35"/>
<rect x="329" y="295" width="245" height="116" rx="4" fill="#61705d"/>
<rect x="586" y="295" width="245" height="116" rx="4" fill="#d4e5ae"/>
<rect x="843" y="295" width="245" height="116" rx="4" fill="#f0f1e8"/>
<rect x="1100" y="295" width="268" height="116" rx="4" fill="#ffffff" stroke="#daddd2"/>
<g class="sans" font-size="12"><g fill="#f8f8f3"><text x="89" y="373">FOREST / PRIMARY</text><text x="89" y="396">#243F35</text><text x="346" y="373">OLIVE / SECONDARY</text><text x="346" y="396">#61705D</text></g><g fill="#243f35"><text x="603" y="373">CITRON / ACCENT</text><text x="603" y="396">#D4E5AE</text><text x="860" y="373">MIST / SURFACE</text><text x="860" y="396">#F0F1E8</text><text x="1117" y="373">WHITE / ELEVATED</text><text x="1117" y="396">#FFFFFF</text></g></g>
<path d="M72 446H1368" stroke="#daddd2"/>

<text x="72" y="483" class="label">02 / A LITERARY VOICE</text>
<text x="72" y="568" class="display" font-size="88" letter-spacing="-4">Elsewhere.</text><text x="650" y="553" class="meta">88 / HERO</text>
<text x="74" y="642" class="display" font-size="60" letter-spacing="-2">A slower pace.</text><text x="650" y="632" class="meta">60 / H1</text>
<text x="74" y="700" class="display" font-size="44" letter-spacing="-1.4">Worth the journey.</text><text x="650" y="693" class="meta">44 / H2</text>
<text x="74" y="742" class="display" font-size="25">Beautiful stays, clear decisions.</text><text x="650" y="738" class="meta">25 / H3</text>
<text x="75" y="778" class="sans" font-size="15" fill="#23362d">Room for the unexpected. Space to feel at home.</text><text x="650" y="777" class="meta">15 / BODY</text>
<text x="75" y="807" class="meta">FRAUNCES / EDITORIAL  +  DM SANS / INTERFACE</text><text x="650" y="807" class="meta">12 / META</text>
<text x="75" y="836" class="meta">SVG specimens use installed fonts with Georgia / Arial fallbacks.</text>

<text x="825" y="483" class="label">03 / QUIETLY FUNCTIONAL</text>
<rect x="825" y="511" width="247" height="51" rx="6" fill="#243f35"/><text x="879" y="542" class="sans" font-size="14" fill="#ffffff">Explore stays →</text>
<rect x="1089" y="511" width="247" height="51" rx="6" fill="none" stroke="#243f35"/><text x="1140" y="542" class="sans" font-size="14" fill="#243f35">Save for later ♡</text>
<rect x="825" y="583" width="247" height="51" rx="6" fill="#d4e5ae"/><text x="884" y="614" class="sans" font-size="14" fill="#243f35">A little inspiration</text>
<rect x="1089" y="583" width="247" height="51" rx="6" fill="#355548"/><rect x="1085" y="579" width="255" height="59" rx="8" fill="none" stroke="#243f35" stroke-width="2"/><text x="1141" y="614" class="sans" font-size="14" fill="#ffffff">Hover + focus</text>
<text x="827" y="665" class="meta">Primary · outline · accent · offset keyboard focus</text>
<rect x="825" y="688" width="511" height="80" rx="6" fill="#ffffff" stroke="#daddd2"/><text x="846" y="714" class="label">YOUR NEXT CHAPTER</text><text x="846" y="744" class="sans" font-size="16" fill="#243f35">Where would you like to go?</text><path d="m1292 728 6 6 6-6" fill="none" stroke="#243f35" stroke-width="1.5"/>

<path d="M72 875H752" stroke="#daddd2"/>
